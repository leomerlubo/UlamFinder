<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pinoy Ulam Finder</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  >

  <style>
    :root {
      --primary: #2f6b3f;
      --primary-dark: #19452a;
      --primary-light: #e7f2e8;
      --accent: #d99a28;
      --clay: #a84727;
      --clay-dark: #7f2f1d;
      --banana: #5f873f;
      --rice: #fff9e9;
      --background: #f8f3e7;
      --surface: #fffdf7;
      --text: #263028;
      --muted: #6f746d;
      --border: #ded9ca;
      --danger: #b91c1c;

      --shadow:
        0 12px 30px
        rgba(38, 73, 43, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          rgba(248, 243, 231, 0.95),
          rgba(248, 243, 231, 0.95)
        ),
        repeating-linear-gradient(
          45deg,
          rgba(92, 112, 70, 0.08) 0,
          rgba(92, 112, 70, 0.08) 1px,
          transparent 1px,
          transparent 12px
        );
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .hero {
      position: relative;
      overflow: hidden;

      padding:
        36px 20px
        38px;

      color: white;

      background:
        radial-gradient(
          circle at 82% 18%,
          rgba(232, 188, 80, 0.30),
          transparent 30%
        ),
        linear-gradient(
          125deg,
          #143d26,
          #2f6b3f 56%,
          #678c43
        );
    }

    .hero::before,
    .hero::after {
      position: absolute;
      content: '';
      pointer-events: none;
    }

    .hero::before {
      width: 440px;
      height: 150px;
      top: -45px;
      right: -105px;
      border: 2px solid rgba(255, 255, 255, 0.10);
      border-radius: 100% 0 100% 0;
      transform: rotate(-16deg);
      background:
        linear-gradient(
          165deg,
          rgba(255, 255, 255, 0.11),
          rgba(255, 255, 255, 0.01)
        );
    }

    .hero::after {
      right: 0;
      bottom: 0;
      left: 0;
      height: 10px;
      background:
        repeating-linear-gradient(
          90deg,
          var(--accent) 0,
          var(--accent) 22px,
          rgba(255, 249, 233, 0.88) 22px,
          rgba(255, 249, 233, 0.88) 31px,
          var(--clay) 31px,
          var(--clay) 53px
        );
    }

    .hero-inner {
      position: relative;
      z-index: 1;

      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .hero-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;

      margin-bottom: 24px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 17px;
      min-width: 0;
    }

    .brand-mark {
      flex: 0 0 auto;
      width: 82px;
      height: 82px;
      filter:
        drop-shadow(
          0 8px 12px
          rgba(0, 0, 0, 0.18)
        );
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 8px 13px;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(36px, 5vw, 56px);

      line-height: 0.98;
      letter-spacing: -0.025em;
      text-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.18);
    }

    .brand-byline {
      padding-bottom: 5px;
      color: #f9d98a;
      font-family:
        Georgia,
        'Times New Roman',
        serif;
      font-size: 16px;
      font-style: italic;
      white-space: nowrap;
    }

    .brand-tagline {
      margin: 7px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      letter-spacing: 0.035em;
    }

    .add-dish-button {
      flex: 0 0 auto;

      padding: 13px 19px;

      border: 0;
      border-radius: 12px;

      background: white;
      color: var(--primary-dark);

      font-weight: 700;

      box-shadow:
        0 8px 22px
        rgba(0, 0, 0, 0.15);
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auth-button {
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 12px;
      background: transparent;
      color: white;
      font-weight: 700;
    }

    .search-container {
      position: relative;
      max-width: 860px;
    }

    .search-input {
      width: 100%;
      min-height: 58px;

      padding:
        0 54px
        0 18px;

      border: 0;
      border-radius: 16px;

      outline: none;

      background: white;

      font-size: 16px;

      box-shadow:
        0 14px 28px
        rgba(0, 0, 0, 0.18);
    }

    .clear-search-button {
      position: absolute;
      top: 50%;
      right: 13px;

      display: none;

      width: 34px;
      height: 34px;

      transform: translateY(-50%);

      border: 0;
      border-radius: 50%;

      background: #f5f5f4;
      color: var(--muted);

      font-size: 20px;
    }

    .autocomplete {
      position: absolute;
      z-index: 50;

      top: calc(100% + 8px);
      left: 0;
      right: 0;

      display: none;

      max-height: 280px;
      overflow-y: auto;

      border-radius: 14px;

      background: white;
      color: var(--text);

      box-shadow: var(--shadow);
    }

    .autocomplete-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      width: 100%;

      padding: 13px 16px;

      border: 0;
      border-bottom:
        1px solid var(--border);

      background: white;

      text-align: left;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--primary-light);
    }

    .autocomplete-type {
      color: var(--muted);
      font-size: 12px;
    }

    main {
      width:
        min(1180px, calc(100% - 32px));

      margin: 0 auto;

      padding:
        28px 0
        56px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 22px;
    }

    .total-count,
    .result-summary {
      color: var(--muted);
      font-size: 14px;
    }

    .category-grid {
      display: grid;

      grid-template-columns:
        repeat(6, minmax(120px, 1fr));

      gap: 12px;

      margin-bottom: 30px;
    }

    .category-card {
      min-height: 110px;

      padding: 15px 10px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      background: var(--surface);
      color: var(--text);

      text-align: center;

      box-shadow:
        0 6px 18px
        rgba(120, 53, 15, 0.05);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .category-card:hover,
    .category-card.active {
      transform: translateY(-2px);

      border-color: var(--accent);

      background: #fff7ed;
    }

    .category-icon {
      display: block;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .category-name {
      display: block;
      font-weight: 700;
      font-size: 14px;
    }

    .category-count {
      display: block;
      margin-top: 5px;

      color: var(--muted);
      font-size: 12px;
    }

    .results-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      margin-bottom: 17px;
    }

    .reset-button {
      padding: 9px 13px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background: white;
      color: var(--primary-dark);

      font-weight: 700;
    }

    .dish-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 16px;
    }

    .dish-card {
      display: flex;
      flex-direction: column;

      min-height: 165px;

      padding: 18px;

      border:
        1px solid var(--border);

      border-radius: 18px;

      background: var(--surface);

      box-shadow:
        0 8px 24px
        rgba(120, 53, 15, 0.06);
    }

    .dish-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .dish-name-highlight {
      flex: 1;

      margin: 0;

      padding:
        11px 13px;

      border-left:
        4px solid var(--accent);

      border-radius: 10px;

      background: #fff7ed;

      color: #1c1917;

      font-size: 20px;
      line-height: 1.3;
    }

    .category-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
    }

    .category-badge {
      padding: 6px 9px;

      border-radius: 999px;

      background: var(--primary-light);
      color: var(--primary-dark);

      font-size: 11px;
      font-weight: 700;

      white-space: nowrap;
    }

    .card-actions {
      display: grid;

      grid-template-columns:
        1.5fr 1fr 1fr;

      gap: 8px;

      margin-top: auto;
      padding-top: 18px;
    }

    .card-actions button {
      padding: 10px 9px;

      border-radius: 10px;

      font-weight: 700;
    }

    .view-button {
      border: 0;

      background: var(--primary);
      color: white;
    }

    .edit-button {
      border:
        1px solid var(--border);

      background: white;
      color: var(--primary-dark);
    }

    .delete-button {
      border:
        1px solid #fecaca;

      background: #fff1f2;
      color: var(--danger);
    }

    .loading-state,
    .empty-state {
      padding: 58px 24px;

      border-radius: 18px;

      text-align: center;
      color: var(--muted);
    }

    .empty-state {
      display: none;

      border:
        1px dashed #d6d3d1;

      background: white;
    }

    .empty-title {
      margin: 0 0 8px;
      color: var(--text);
    }

    .modal-backdrop {
      position: fixed;
      z-index: 100;

      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(41, 37, 36, 0.65);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(800px, 100%);
      max-height: calc(100vh - 40px);

      overflow-y: auto;

      border-radius: 20px;

      background: white;

      box-shadow:
        0 24px 60px
        rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      position: sticky;
      z-index: 10;
      top: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      padding: 20px 22px;

      border-bottom:
        1px solid var(--border);

      background: white;
    }

    .modal-title {
      margin: 0;
      font-size: 22px;
    }

    .close-modal-button {
      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 50%;

      background: #f5f5f4;
      color: var(--text);

      font-size: 21px;
    }

    .dish-form {
      padding: 22px;
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 18px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      color: var(--danger);
    }

    .text-input,
    .text-area {
      width: 100%;

      padding: 12px 13px;

      border:
        1px solid var(--border);

      border-radius: 11px;

      outline: none;

      background: white;
    }

    .text-input:focus,
    .text-area:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 3px
        rgba(245, 158, 11, 0.16);
    }

    .text-area {
      min-height: 105px;
      resize: vertical;
    }

    .text-area.large {
      min-height: 150px;
    }

    .field-help {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .variant-section-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .variant-section-header .field-help {
      margin: 5px 0 0;
    }

    .add-variant-button {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: white;
      font-weight: 700;
    }

    .variant-list {
      display: grid;
      gap: 18px;
    }

    .variant-card {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fffbf7;
    }

    .variant-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .variant-card-title {
      margin: 0;
      color: var(--primary-dark);
      font-size: 18px;
    }

    .remove-variant-button {
      padding: 8px 11px;
      border: 1px solid #fecaca;
      border-radius: 9px;
      background: #fff1f2;
      color: var(--danger);
      font-weight: 700;
    }

    .variant-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .variant-form-grid .full {
      grid-column: 1 / -1;
    }

    .variant-count {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .category-checkbox-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 10px;
    }

    .category-checkbox-label {
      display: flex;
      align-items: center;
      gap: 9px;

      min-height: 45px;

      padding: 10px 12px;

      border:
        1px solid var(--border);

      border-radius: 11px;

      background: white;

      cursor: pointer;
    }

    .category-checkbox-label:hover {
      border-color: var(--accent);
      background: #fff7ed;
    }

    .category-checkbox-label.selected {
      border-color: var(--accent);

      background: var(--primary-light);
      color: var(--primary-dark);

      font-weight: 700;
    }

    .category-checkbox-label input {
      width: 17px;
      height: 17px;

      accent-color: var(--primary);
    }

    .tag-editor {
      position: relative;

      min-height: 49px;

      padding: 8px;

      border:
        1px solid var(--border);

      border-radius: 11px;

      background: white;
    }

    .tag-editor:focus-within {
      border-color: var(--accent);

      box-shadow:
        0 0 0 3px
        rgba(245, 158, 11, 0.16);
    }

    .tag-editor-content {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .tag-editor-input {
      flex: 1 1 170px;

      min-width: 130px;

      padding: 6px 4px;

      border: 0;
      outline: none;

      background: transparent;
    }

    .editable-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 9px;

      border-radius: 999px;

      background: var(--primary-light);
      color: var(--primary-dark);

      font-size: 12px;
      font-weight: 700;
    }

    .remove-tag-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 18px;
      height: 18px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background:
        rgba(124, 45, 18, 0.13);

      color: var(--primary-dark);
    }

    .tag-suggestions {
      position: absolute;
      z-index: 30;

      top: calc(100% + 7px);
      left: 0;
      right: 0;

      display: none;

      max-height: 220px;
      overflow-y: auto;

      border:
        1px solid var(--border);

      border-radius: 11px;

      background: white;

      box-shadow: var(--shadow);
    }

    .tag-suggestion-button {
      display: block;

      width: 100%;

      padding: 11px 12px;

      border: 0;
      border-bottom:
        1px solid var(--border);

      background: white;

      text-align: left;
    }

    .tag-suggestion-button:hover {
      background: var(--primary-light);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      margin-top: 23px;
      padding-top: 19px;

      border-top:
        1px solid var(--border);
    }

    .cancel-button,
    .save-button {
      padding: 11px 18px;

      border-radius: 11px;

      font-weight: 700;
    }

    .cancel-button {
      border:
        1px solid var(--border);

      background: white;
      color: var(--text);
    }

    .save-button {
      border: 0;

      background: var(--primary);
      color: white;
    }

    .confirmation-backdrop {
      z-index: 220;
    }

    .confirmation-dialog {
      width: min(440px, 100%);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 20px;
      background: white;
      box-shadow:
        0 26px 70px
        rgba(0, 0, 0, 0.32);
      animation: confirmation-pop 0.18s ease-out;
    }

    @keyframes confirmation-pop {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .confirmation-body {
      padding: 25px 24px 20px;
      text-align: center;
    }

    .confirmation-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 25px;
      font-weight: 800;
    }

    .confirmation-dialog.danger .confirmation-icon {
      background: #fff1f2;
      color: var(--danger);
    }

    .confirmation-title {
      margin: 0 0 9px;
      color: var(--text);
      font-size: 22px;
    }

    .confirmation-message {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .confirmation-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      background: #fffdf8;
    }

    .confirmation-actions button {
      min-width: 105px;
      padding: 11px 17px;
      border-radius: 11px;
      font-weight: 700;
    }

    .confirmation-cancel {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
    }

    .confirmation-confirm {
      border: 0;
      background: var(--primary);
      color: white;
    }

    .confirmation-confirm.danger {
      background: var(--danger);
    }

    .confirmation-cancel[hidden] {
      display: none;
    }

    .details-content {
      padding: 22px;
    }

    .details-dish-name {
      margin: 0 0 14px;

      color: var(--primary-dark);

      font-size:
        clamp(28px, 5vw, 40px);
    }

    .details-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-bottom: 22px;
    }

    .variant-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 18px 0 22px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fafaf9;
    }

    .variant-picker-button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
      color: var(--primary-dark);
      font-weight: 700;
    }

    .variant-picker-button.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .details-variant-name {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 22px;
    }

    .details-section {
      padding: 17px 0;

      border-top:
        1px solid var(--border);
    }

    .details-section:first-of-type {
      border-top: 0;
    }

    .details-heading {
      margin: 0 0 10px;

      color: var(--primary-dark);

      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .details-text {
      margin: 0;

      color: #44403c;

      line-height: 1.7;
      white-space: pre-wrap;
    }

    .details-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .details-tag {
      padding: 7px 10px;

      border-radius: 999px;

      background: #f5f5f4;
      color: #44403c;

      font-size: 13px;
    }

    .details-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      padding:
        0 22px
        22px;
    }

    .details-footer button {
      padding: 10px 16px;

      border-radius: 10px;

      font-weight: 700;
    }

    .toast {
      position: fixed;
      z-index: 200;

      right: 22px;
      bottom: 22px;

      display: none;

      max-width: 370px;

      padding: 14px 16px;

      border-radius: 12px;

      background: #292524;
      color: white;

      box-shadow: var(--shadow);
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      background: var(--danger);
    }

    .add-dish-button {
      background: var(--rice);
    }

    .auth-button {
      border-color: rgba(255, 255, 255, 0.55);
      background: rgba(20, 61, 38, 0.22);
      backdrop-filter: blur(4px);
    }

    .search-input {
      border:
        1px solid
        rgba(255, 255, 255, 0.48);
      background: var(--rice);
    }

    .section-title {
      position: relative;
      padding-left: 17px;
      color: var(--primary-dark);
    }

    .section-title::before {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 0;
      width: 6px;
      border-radius: 999px;
      background:
        linear-gradient(
          var(--accent),
          var(--clay)
        );
      content: '';
    }

    .category-card {
      position: relative;
      overflow: hidden;
      border-color: #d7decc;
      background:
        linear-gradient(
          150deg,
          var(--surface),
          #fbf7e9
        );
    }

    .category-card::after {
      position: absolute;
      top: 8px;
      right: -7px;
      width: 37px;
      height: 12px;
      border-radius: 100% 0 100% 0;
      transform: rotate(-22deg);
      background: rgba(95, 135, 63, 0.16);
      content: '';
    }

    .category-card:hover,
    .category-card.active {
      border-color: var(--banana);
      background: #eef5e8;
    }

    .dish-card {
      border-color: #d9ddcf;
      border-top: 4px solid var(--banana);
      background:
        linear-gradient(
          160deg,
          var(--surface),
          #fffaf0
        );
    }

    .dish-name-highlight {
      border-left-color: var(--clay);
      background: #fff5df;
      color: var(--clay-dark);
    }

    .reset-button {
      border-color: #ccd7c7;
      background: var(--rice);
    }

    @media (max-width: 1000px) {
      .category-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .dish-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .hero-header {
        flex-direction: column;
      }

      .brand-mark {
        width: 68px;
        height: 68px;
      }

      .brand-lockup {
        align-items: flex-start;
        gap: 12px;
      }

      .brand-title-row {
        display: block;
      }

      .brand-byline {
        display: block;
        padding: 5px 0 0;
      }

      .hero-actions {
        width: 100%;
      }

      .hero-actions button {
        flex: 1;
      }

      .add-dish-button {
        width: 100%;
      }

      .category-grid,
      .dish-grid,
      .form-grid,
      .category-checkbox-grid,
      .variant-form-grid {
        grid-template-columns: 1fr;
      }

      .form-field.full {
        grid-column: auto;
      }

      .variant-form-grid .full {
        grid-column: auto;
      }

      .variant-section-header {
        flex-direction: column;
      }

      .add-variant-button {
        width: 100%;
      }

      .results-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .dish-card-header {
        flex-direction: column;
      }

      .category-badges {
        justify-content: flex-start;
      }

      .card-actions {
        grid-template-columns: 1fr;
      }

      .modal-actions,
      .details-footer {
        flex-direction: column-reverse;
      }

      .modal-actions button,
      .details-footer button {
        width: 100%;
      }
    }
  </style>
</head>

  <script type="module" src="/src/firebase.js"></script>

  <script>
    const appState = {
      categories: [],
      dishes: [],
      ingredientSuggestions: [],
      activeCategories: [],
      searchTerm: '',
      autocompleteIndex: -1,
      selectedDish: null,
      selectedVariantIndex: 0,
      canEdit: false,
      editorEmail: ''
    };


    const categoryIcons = {
      Pork: '🐖',
      Chicken: '🍗',
      Beef: '🥩',
      'Fish & Seafood': '🐟',
      Vegetable: '🥬',
      'Non Rice Based': '🍝'
    };


    let variantEditorCounter = 0;
    let variantEditors = [];
    let dishFormInitialSnapshot = '';
    let confirmationResolver = null;
    let isDishSaving = false;


    document.addEventListener(
      'DOMContentLoaded',
      initializeApp
    );


    function initializeApp() {
      bindPageEvents();
      window.ulamApi.subscribeToAuth(
        updateAuthState
      );
      loadAppData();
    }


    function bindPageEvents() {
      const searchInput =
        document.getElementById(
          'searchInput'
        );

      document
        .getElementById('authButton')
        .addEventListener(
          'click',
          handleAuthButton
        );

      document
        .getElementById('addVariantButton')
        .addEventListener(
          'click',
          () => addVariantEditor()
        );

      searchInput.addEventListener(
        'input',
        handleSearchInput
      );

      searchInput.addEventListener(
        'keydown',
        handleSearchKeyboard
      );


      document
        .getElementById(
          'clearSearchButton'
        )
        .addEventListener(
          'click',
          clearSearch
        );


      document
        .getElementById(
          'resetFiltersButton'
        )
        .addEventListener(
          'click',
          resetFilters
        );


      document
        .getElementById(
          'dishForm'
        )
        .addEventListener(
          'submit',
          submitDishForm
        );


      document
        .getElementById(
          'detailsEditButton'
        )
        .addEventListener(
          'click',
          () => {
            const dish =
              appState.selectedDish;

            if (dish) {
              confirmOpenDishEditor(
                dish,
                true
              );
            }
          }
        );


      document
        .getElementById(
          'confirmationCancelButton'
        )
        .addEventListener(
          'click',
          () => resolveConfirmation(false)
        );

      document
        .getElementById(
          'confirmationConfirmButton'
        )
        .addEventListener(
          'click',
          () => resolveConfirmation(true)
        );

      document.addEventListener(
        'keydown',
        event => {
          if (event.key !== 'Escape') {
            return;
          }

          const confirmationBackdrop =
            document.getElementById(
              'confirmationModalBackdrop'
            );

          if (
            confirmationBackdrop
              .classList
              .contains('open')
          ) {
            resolveConfirmation(false);
            return;
          }

          const dishBackdrop =
            document.getElementById(
              'dishModalBackdrop'
            );

          if (
            dishBackdrop
              .classList
              .contains('open')
          ) {
            requestCloseDishModal();
            return;
          }

          const detailsBackdrop =
            document.getElementById(
              'detailsModalBackdrop'
            );

          if (
            detailsBackdrop
              .classList
              .contains('open')
          ) {
            closeDetailsModal();
          }
        }
      );

      window.addEventListener(
        'beforeunload',
        event => {
          if (
            isDishModalOpen() &&
            hasUnsavedDishChanges()
          ) {
            event.preventDefault();
            event.returnValue = '';
          }
        }
      );


      document
        .getElementById(
          'detailsModalBackdrop'
        )
        .addEventListener(
          'click',
          event => {
            if (
              event.target.id ===
              'detailsModalBackdrop'
            ) {
              closeDetailsModal();
            }
          }
        );


      document.addEventListener(
        'click',
        event => {
          if (
            !event.target.closest(
              '.search-container'
            )
          ) {
            hideSearchAutocomplete();
          }
        }
      );
    }


    async function handleAuthButton() {
      try {
        if (appState.editorEmail) {
          await window.ulamApi.signOutEditor();
        } else {
          await window.ulamApi.signInEditor();
        }
      } catch (error) {
        handleServerError(error);
      }
    }


    function updateAuthState(authState) {
      appState.canEdit =
        Boolean(authState.canEdit);

      appState.editorEmail =
        authState.email || '';

      const authButton =
        document.getElementById(
          'authButton'
        );

      authButton.textContent =
        appState.editorEmail
          ? 'Sign Out'
          : 'Editor Sign In';

      authButton.title =
        appState.editorEmail;

      document
        .getElementById('addDishButton')
        .hidden = !appState.canEdit;

      document
        .getElementById(
          'detailsEditButton'
        )
        .hidden = !appState.canEdit;

      renderDishes();
    }


    async function loadAppData() {
      document
        .getElementById(
          'loadingState'
        )
        .style.display = 'block';

      try {
        const data =
          await window.ulamApi.getAppData();

          appState.categories =
            data.categories || [];

          appState.dishes =
            data.dishes || [];

          appState.ingredientSuggestions =
            data.ingredientSuggestions || [];

          renderCategoryCards();
          renderDishes();

          document
            .getElementById(
              'loadingState'
            )
            .style.display = 'none';
      } catch (error) {
        handleServerError(error);
      }
    }


    function renderCategoryCards() {
      const container =
        document.getElementById(
          'categoryGrid'
        );

      container.innerHTML = '';

      appState.categories.forEach(
        category => {
          const count =
            appState.dishes.filter(
              dish =>
                dish.mainCategories.includes(
                  category
                )
            ).length;

          const isActive =
            appState.activeCategories.includes(
              category
            );

          const button =
            document.createElement(
              'button'
            );

          button.type = 'button';

          button.className =
            `category-card${
              isActive ? ' active' : ''
            }`;

          button.innerHTML = `
            <span class="category-icon">
              ${
                categoryIcons[category] ||
                '🍲'
              }
            </span>

            <span class="category-name">
              ${escapeHtml(category)}
            </span>

            <span class="category-count">
              ${count}
              ${count === 1 ? 'dish' : 'dishes'}
            </span>
          `;

          button.addEventListener(
            'click',
            () =>
              toggleCategoryFilter(
                category
              )
          );

          container.appendChild(button);
        }
      );

      const total =
        appState.dishes.length;

      document
        .getElementById(
          'totalDishCount'
        )
        .textContent =
          `${total} total ${
            total === 1
              ? 'dish'
              : 'dishes'
          }`;
    }


    function toggleCategoryFilter(category) {
      const index =
        appState
          .activeCategories
          .indexOf(category);

      if (index >= 0) {
        appState
          .activeCategories
          .splice(index, 1);
      } else {
        appState
          .activeCategories
          .push(category);
      }

      renderCategoryCards();
      renderDishes();
    }


    function handleSearchInput(event) {
      appState.searchTerm =
        event.target.value.trim();

      appState.autocompleteIndex = -1;

      document
        .getElementById(
          'clearSearchButton'
        )
        .style.display =
          appState.searchTerm
            ? 'block'
            : 'none';

      renderSearchAutocomplete();
      renderDishes();
    }


    function clearSearch() {
      const input =
        document.getElementById(
          'searchInput'
        );

      input.value = '';

      appState.searchTerm = '';

      document
        .getElementById(
          'clearSearchButton'
        )
        .style.display = 'none';

      hideSearchAutocomplete();
      renderDishes();

      input.focus();
    }


    function resetFilters() {
      appState.activeCategories = [];
      appState.searchTerm = '';

      const input =
        document.getElementById(
          'searchInput'
        );

      input.value = '';

      document
        .getElementById(
          'clearSearchButton'
        )
        .style.display = 'none';

      hideSearchAutocomplete();
      renderCategoryCards();
      renderDishes();
    }


    function getFilteredDishes() {
      const normalizedSearch =
        normalizeText(
          appState.searchTerm
        );

      return appState.dishes.filter(
        dish => {
          const categoryMatches =
            !appState
              .activeCategories
              .length ||
            appState
              .activeCategories
              .some(category =>
                dish
                  .mainCategories
                  .includes(category)
              );

          if (!categoryMatches) {
            return false;
          }

          if (!normalizedSearch) {
            return true;
          }

          const searchableContent = [
            dish.dishName,
            ...dish.mainCategories,
            ...dish.variants.flatMap(
              variant => [
                variant.name,
                `${dish.dishName} ${variant.name}`,
                `${variant.name} ${dish.dishName}`,
                variant.mainCategory,
                ...variant.mainIngredients,
                ...variant.subIngredients,
                variant.description,
                variant.recipeGuideline,
                variant.cookingInstructions
              ]
            )
          ].join(' ');

          return normalizeText(
            searchableContent
          ).includes(
            normalizedSearch
          );
        }
      );
    }


    function renderDishes() {
      const grid =
        document.getElementById(
          'dishGrid'
        );

      const emptyState =
        document.getElementById(
          'emptyState'
        );

      const dishes =
        getFilteredDishes();

      grid.innerHTML = '';

      dishes.forEach(dish => {
        grid.appendChild(
          createDishCard(dish)
        );
      });

      emptyState.style.display =
        dishes.length
          ? 'none'
          : 'block';

      updateResultSummary(
        dishes.length
      );
    }


    function createDishCard(dish) {
      const card =
        document.createElement(
          'article'
        );

      card.className = 'dish-card';

      const categoryBadges =
        dish.mainCategories
          .map(category => `
            <span class="category-badge">
              ${escapeHtml(category)}
            </span>
          `)
          .join('');

      card.innerHTML = `
        <div class="dish-card-header">

          <h3 class="dish-name-highlight">
            ${escapeHtml(dish.dishName)}
          </h3>

          <div class="category-badges">
            ${categoryBadges}
          </div>

        </div>

        <p class="variant-count">
          ${dish.variants.length}
          ${
            dish.variants.length === 1
              ? 'variant'
              : 'variants'
          }
        </p>


        <div class="card-actions">

          <button
            class="view-button"
            type="button"
          >
            View Details
          </button>

          ${appState.canEdit ? `
            <button
              class="edit-button"
              type="button"
            >
              Edit
            </button>

            <button
              class="delete-button"
              type="button"
            >

      `;

    function renderSearchAutocomplete() {
      const container =
        document.getElementById(
          'searchAutocomplete'
        );

      const searchTerm =
        normalizeText(
          appState.searchTerm
        );

      if (!searchTerm) {
        hideSearchAutocomplete();
        return;
      }

      const ingredientResults =
        appState
          .ingredientSuggestions
          .filter(ingredient =>
            normalizeText(
              ingredient
            ).includes(searchTerm)
          )
          .map(ingredient => ({
            value: ingredient,
            type: 'Ingredient'
          }));

      const dishResults =
        appState
          .dishes
          .map(dish => dish.dishName)
          .filter(name =>
            normalizeText(name)
              .includes(searchTerm)
          )
          .map(name => ({
            value: name,
            type: 'Dish'
          }));

      const variantResults =
        appState
          .dishes
          .flatMap(dish =>
            dish.variants.map(variant => ({
              value: variant.name,
              type: dish.dishName
            }))
          )
          .filter(item =>
            normalizeText(item.value)
              .includes(searchTerm)
          );

      const suggestions =
        uniqueSuggestions([
          ...ingredientResults,
          ...dishResults,
          ...variantResults
        ]).slice(0, 10);

      if (!suggestions.length) {
        hideSearchAutocomplete();
        return;
      }

      container.innerHTML = '';

      suggestions.forEach(
        (suggestion, index) => {
          const button =
            document.createElement(
              'button'
            );

          button.type = 'button';

          button.className =
            `autocomplete-item${
              index ===
              appState.autocompleteIndex
                ? ' active'
                : ''
            }`;

          button.innerHTML = `
            <strong>
              ${escapeHtml(
                suggestion.value
              )}
            </strong>

            <span class="autocomplete-type">
              ${escapeHtml(
                suggestion.type
              )}
            </span>
          `;

          button.addEventListener(
            'mousedown',
            event => {
              event.preventDefault();

              selectSearchSuggestion(
                suggestion.value
              );
            }
          );

          container.appendChild(button);
        }
      );

      container.style.display = 'block';
    }


    function handleSearchKeyboard(event) {
      const container =
        document.getElementById(
          'searchAutocomplete'
        );

      const buttons =
        Array.from(
          container.querySelectorAll(
            '.autocomplete-item'
          )
        );

      if (
        container.style.display !==
          'block' ||
        !buttons.length
      ) {
        return;
      }

      if (event.key === 'ArrowDown') {
        event.preventDefault();

        appState.autocompleteIndex =
          Math.min(
            appState.autocompleteIndex + 1,
            buttons.length - 1
          );

        renderSearchAutocomplete();
      }

      if (event.key === 'ArrowUp') {
        event.preventDefault();

        appState.autocompleteIndex =
          Math.max(
            appState.autocompleteIndex - 1,
            0
          );

        renderSearchAutocomplete();
      }

      if (
        event.key === 'Enter' &&
        appState.autocompleteIndex >= 0
      ) {
        event.preventDefault();

        buttons[
          appState.autocompleteIndex
        ].dispatchEvent(
          new MouseEvent('mousedown')
        );
      }
    }

          confirmText: 'Remove Variant',

    async function submitDishForm(event) {
      event.preventDefault();

      const payload = {
        id:
          document
            .getElementById(
              'dishId'
            )
            .value
            .trim(),

        dishName:
          document
            .getElementById(
              'dishName'
            )
            .value
            .trim(),

        variants: getVariantPayloads()
      };

      if (!payload.dishName) {
        showToast(
          'Please enter the dish name.',
          true
        );

        return;
      }

      if (!payload.variants.length) {
        showToast(
          'Please add at least one dish variant.',
          true
        );

        return;
      }

      for (
        let index = 0;
        index < payload.variants.length;
        index += 1
      ) {
        const variant = payload.variants[index];
        const number = index + 1;

        if (!variant.name) {
          showToast(
            `Please enter a name for variant ${number}.`,
            true
          );
          return;
        }

        if (!variant.mainCategory) {
          showToast(
            `Please select a category for ${variant.name}.`,
            true
          );
          return;
        }

        if (!variant.mainIngredients.length) {
          showToast(
            `Please add a main ingredient for ${variant.name}.`,
            true
          );
          return;
        }
      }

      const isEditing = Boolean(payload.id);
      const confirmed =
        await showConfirmation({
          title:
            isEditing
              ? 'Save your updates?'
              : 'Save this new dish?',
          message:
            isEditing
              ? 'This will replace the saved dish information with the updates in this form.'
              : 'This dish and all of its variants will be added to Ulam Finder.',
          confirmText:
            isEditing
              ? 'Save Updates'
              : 'Save Dish'
        });

      if (!confirmed) {
        return;
      }

      const button =
        document.getElementById(
          'saveDishButton'
        );

      button.disabled = true;
      button.textContent = 'Saving...';
      isDishSaving = true;

      try {
        const response =
          await window.ulamApi.saveDish(
            payload
          );

          button.disabled = false;
          button.textContent =
            'Save Dish';

          closeDishModal();
          await loadAppData();

          await showConfirmation({
            title: 'Dish saved',
            message:
              response.message ||
              'All dish information was saved successfully.',
            confirmText: 'Done',
            cancelText: ''
          });
      } catch (error) {
          button.disabled = false;
          button.textContent =
            'Save Dish';
          isDishSaving = false;

          handleServerError(error);
      }
    }


    async function confirmDeleteDish(dish) {
      const confirmed =
        await showConfirmation({
          title: 'Delete this dish?',
          message:
            `"${dish.dishName}" and all of its variants will be permanently deleted.`,
          confirmText: 'Delete Dish',
          tone: 'danger'
        });

      if (!confirmed) {
        return;
      }

      try {
        const response =
          await window.ulamApi.deleteDish(
            dish.id
          );

          showToast(response.message);
          await loadAppData();
      } catch (error) {
        handleServerError(error);
      }
    }


    class TagEditor {
      constructor(
        rootElement,
        suggestionProvider
      ) {
        this.root = rootElement;

        this.input =
          rootElement.querySelector(
            '.tag-editor-input'
          );

        this.content =
          rootElement.querySelector(
            '.tag-editor-content'
          );

        this.suggestionBox =
          rootElement.querySelector(
            '.tag-suggestions'
          );

        this.suggestionProvider =
          suggestionProvider;

        this.tags = [];

        this.bindEvents();
      }


      bindEvents() {
        this.input.addEventListener(
          'keydown',
          event => {
            if (
              event.key === ',' ||
              event.key === 'Enter'
            ) {
              event.preventDefault();

              this.commitPendingValue();
            }

            if (
              event.key === 'Backspace' &&
              !this.input.value &&
              this.tags.length
            ) {
              this.tags.pop();
              this.renderTags();
            }
          }
        );

        this.input.addEventListener(
          'input',
          () => {
            if (
              this.input.value.includes(',')
            ) {
              const values =
                this.input.value.split(',');

              const remaining =
                values.pop();

              values.forEach(value =>
                this.addTag(value)
              );

              this.input.value =
                remaining;
            }

            this.renderSuggestions();
          }
        );

        this.root.addEventListener(
          'click',
          () => this.input.focus()
        );
      }


      addTag(value) {
        const cleaned =
          String(value || '')
            .trim()
            .replace(/\s+/g, ' ');

        if (!cleaned) {
          return;
        }

        const exists =
          this.tags.some(
            tag =>
              normalizeText(tag) ===
              normalizeText(cleaned)
          );

        if (exists) {
          return;
        }

        this.tags.push(cleaned);
        this.renderTags();
      }


      removeTag(index) {
        this.tags.splice(index, 1);
        this.renderTags();
      }


      commitPendingValue() {
        this.addTag(
          this.input.value
        );

        this.input.value = '';

        this.hideSuggestions();
      }


      setTags(tags) {
        this.tags =
          uniqueTextItems(tags || []);

        this.input.value = '';

        this.renderTags();
      }


      getTags() {
        return [...this.tags];
      }


      renderTags() {
        this.content
          .querySelectorAll(
            '.editable-tag'
          )
          .forEach(element =>
            element.remove()
          );

        this.tags.forEach(
          (tag, index) => {
            const tagElement =
              document.createElement(
                'span'
              );

            tagElement.className =
              'editable-tag';

            const tagText =
              document.createElement(
                'span'
              );

            tagText.textContent = tag;

            const removeButton =
              document.createElement(
                'button'
              );

            removeButton.type = 'button';

            removeButton.className =
              'remove-tag-button';

            removeButton.textContent = '×';

            removeButton.addEventListener(
              'click',
              event => {
                event.stopPropagation();

                this.removeTag(index);
              }
            );

            tagElement.appendChild(tagText);

            tagElement.appendChild(
              removeButton
            );

            this.content.insertBefore(
              tagElement,
              this.input
            );
          }
        );
      }


      renderSuggestions() {
        const searchTerm =
          normalizeText(
            this.input.value
          );

        if (!searchTerm) {
          this.hideSuggestions();
          return;
        }

        const suggestions =
          this
            .suggestionProvider()
            .filter(ingredient =>
              normalizeText(
                ingredient
              ).includes(searchTerm)
            )
            .filter(ingredient =>
              !this.tags.some(
                tag =>
                  normalizeText(tag) ===
                  normalizeText(
                    ingredient
                  )
              )
            )
            .slice(0, 8);

        if (!suggestions.length) {
          this.hideSuggestions();
          return;
        }

        this.suggestionBox.innerHTML = '';

        suggestions.forEach(
          ingredient => {
            const button =
              document.createElement(
                'button'
              );

            button.type = 'button';

            button.className =
              'tag-suggestion-button';

            button.textContent =
              ingredient;

            button.addEventListener(
              'mousedown',
              event => {
                event.preventDefault();

                this.addTag(ingredient);

                this.input.value = '';

                this.hideSuggestions();
              }
            );

            this.suggestionBox.appendChild(
              button
            );
          }
        );

        this.suggestionBox.style.display =
          'block';
      }


      hideSuggestions() {
        this.suggestionBox.style.display =
          'none';

        this.suggestionBox.innerHTML = '';
      }
    }


    function showConfirmation({
      title,
      message,
      confirmText = 'Confirm',
      cancelText = 'Cancel',
      tone = 'primary'
    }) {
      if (confirmationResolver) {
        confirmationResolver(false);
      }

      const backdrop =
        document.getElementById(
          'confirmationModalBackdrop'
        );
      const dialog =
        document.getElementById(
          'confirmationDialog'
        );
      const titleElement =
        document.getElementById(
          'confirmationTitle'
        );
      const messageElement =
        document.getElementById(
          'confirmationMessage'
        );
      const iconElement =
        document.getElementById(
          'confirmationIcon'
        );
      const cancelButton =
        document.getElementById(
          'confirmationCancelButton'
        );
      const confirmButton =
        document.getElementById(
          'confirmationConfirmButton'
        );

      titleElement.textContent = title;
      messageElement.textContent = message;
      confirmButton.textContent = confirmText;
      cancelButton.textContent =
        cancelText || 'Cancel';
      cancelButton.hidden = !cancelText;

      const isDanger = tone === 'danger';
      dialog.classList.toggle(
        'danger',
        isDanger
      );
      confirmButton.classList.toggle(
        'danger',
        isDanger
      );
      iconElement.textContent =
        isDanger ? '!' : '✓';

      backdrop.classList.add('open');

      window.setTimeout(
        () => confirmButton.focus(),
        0
      );

      return new Promise(resolve => {
        confirmationResolver = resolve;
      });
    }


    function resolveConfirmation(result) {
      if (!confirmationResolver) {
        return;
      }

      const resolve = confirmationResolver;
      confirmationResolver = null;

      document
        .getElementById(
          'confirmationModalBackdrop'
        )
        .classList.remove('open');

      resolve(result);
    }


    function handleServerError(error) {
      document
        .getElementById(
          'loadingState'
        )
        .style.display = 'none';

      showToast(
        error && error.message
          ? error.message
          : 'Something went wrong.',
        true
      );
    }


    function showToast(
      message,
      isError = false
    ) {
      const toast =
        document.getElementById(
          'toast'
        );

      toast.textContent = message;

      toast.className =
        `toast show${
          isError ? ' error' : ''
        }`;

      clearTimeout(
        showToast.timeoutId
      );

      showToast.timeoutId =
        setTimeout(() => {
          toast.className = 'toast';
        }, 3500);
    }


    function normalizeText(value) {
      return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(
          /[\u0300-\u036f]/g,
          ''
        )
        .trim();
    }


    function uniqueTextItems(items) {
      const result = [];
      const seen = new Set();

      items.forEach(item => {
        const cleaned =
          String(item || '').trim();

        const key =
          normalizeText(cleaned);

        if (
          cleaned &&
          !seen.has(key)
        ) {
          seen.add(key);
          result.push(cleaned);
        }
      });

      return result;
    }


    function uniqueSuggestions(items) {
      const result = [];
      const seen = new Set();

      items.forEach(item => {
        const key =
          normalizeText(item.value);

        if (!seen.has(key)) {
          seen.add(key);
          result.push(item);
        }
      });

      return result;
    }


    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
